# O plano grátis do Render adormece o servidor depois de 15 min sem acesso,
# e aí a rotina de lembretes por e-mail para. Este workflow chama o /ping a cada 10 min.
# Só roda se existir a variável SERVIDOR_URL (ex.: https://easyagenda-servidor.onrender.com),
# criada em Settings > Secrets and variables > Actions > Variables.
name: Manter servidor acordado

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.SERVIDOR_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o /ping
        run: curl -fsS --max-time 120 --retry 2 "${{ vars.SERVIDOR_URL }}/ping"
