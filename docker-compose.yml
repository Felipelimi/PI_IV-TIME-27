services:
  mongo:
    # MongoDB 7: o 8.x se recusa a iniciar em kernels Linux 6.19+ (ex.: Linux Mint 22 / Ubuntu 24.04
    # com kernel 7.0). Veja https://jira.mongodb.org/browse/SERVER-125742
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./servidor/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  servidor:
    build: ./servidor
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-easyagenda}
      # Lembrete por e-mail: sem SMTP_HOST, os e-mails só aparecem no log do servidor
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      LEMBRETE_ANTECEDENCIA_HORAS: ${LEMBRETE_ANTECEDENCIA_HORAS:-24}
      LEMBRETE_INTERVALO_MINUTOS: ${LEMBRETE_INTERVALO_MINUTOS:-10}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
